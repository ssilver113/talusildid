		<script>
		// Lightbox: a sign grows out of its spot in the gallery and shrinks back on close.
		// Click or tap anywhere (or Esc) closes; arrows, arrow keys or a swipe step through the signs.
		// It shows the link's href, so a bigger file can be linked later without touching this.
		(function () {
			var links = Array.prototype.slice.call(document.querySelectorAll('.gallery .zoom'));
			var dlg = document.querySelector('.lightbox');
			if (!links.length || !dlg || !dlg.showModal) return;
			var shade = dlg.querySelector('.lb-shade');
			var frame = dlg.querySelector('.lb-frame');
			var img = frame.querySelector('img');
			var caption = dlg.querySelector('.lb-caption');
			var nav = dlg.querySelector('.lb-nav');
			var count = dlg.querySelector('.lb-count');
			var closeBtn = dlg.querySelector('.lb-close');
			var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
			var ease = 'cubic-bezier(0.2, 0, 0, 1)';
			var FRAME = 28;     // frame padding, border and outline around the picture
			var MAX_W = 1280;   // on big screens the sign keeps paper-dark space around it
			var MAX_UP = 2;     // never stretch a file past twice its own size
			var current = -1, anims = [], closing = false;

			function thumb(i) { return links[i].querySelector('img'); }

			// Where the picture actually sits inside its thumbnail (paired plates letterbox it)
			function contentRect(el) {
				var r = el.getBoundingClientRect();
				var nw = el.naturalWidth || el.width, nh = el.naturalHeight || el.height;
				var s = Math.min(r.width / nw, r.height / nh);
				return { left: r.left + (r.width - nw * s) / 2, top: r.top + (r.height - nh * s) / 2, width: nw * s, height: nh * s };
			}

			function load(i) {
				return new Promise(function (done) {
					var pic = new Image();
					pic.onload = pic.onerror = function () { done(pic); };
					pic.src = links[i].href;
					if (pic.complete) done(pic);
				});
			}

			// Put sign i in the lightbox at its final size
			function fill(i, pic) {
				var fig = links[i].closest('figure').querySelector('figcaption');
				caption.textContent = fig ? fig.textContent : '';
				count.textContent = (i + 1) + ' / ' + links.length;
				img.src = pic.src;
				img.alt = thumb(i).alt;
				var nw = pic.naturalWidth || thumb(i).width, nh = pic.naturalHeight || thumb(i).height;
				var vw = document.documentElement.clientWidth;   // without the scrollbar
				var margin = vw < 600 ? 12 : 48;
				var boxW = Math.min(vw - margin * 2, MAX_W) - FRAME;
				var boxH = innerHeight - margin * 2 - caption.offsetHeight - nav.offsetHeight - 28 - FRAME;
				var s = Math.min(boxW / nw, boxH / nh, MAX_UP);
				img.style.width = Math.round(nw * s) + 'px';
				img.style.height = Math.round(nh * s) + 'px';
			}

			function setHidden(i, hidden) { thumb(i).style.visibility = hidden ? 'hidden' : ''; }

			// Transform that lays the lightbox picture exactly over rect r
			function fromRect(r) {
				var f = frame.getBoundingClientRect(), p = img.getBoundingClientRect();
				var s = r.width / p.width;
				frame.style.transformOrigin = (p.left - f.left) + 'px ' + (p.top - f.top) + 'px';
				return 'translate(' + (r.left - p.left) + 'px, ' + (r.top - p.top) + 'px) scale(' + s + ')';
			}

			function play(opening) {
				var t = opening ? 320 : 260;
				var from = still ? 'none' : fromRect(contentRect(thumb(current)));
				var ink = getComputedStyle(frame).borderTopColor;
				var frameKeys = still
					? [{ opacity: 0 }, { opacity: 1 }]
					: [{ transform: from, borderColor: 'transparent', outlineColor: 'transparent' }, { transform: 'none', borderColor: ink, outlineColor: ink }];
				var fade = [{ opacity: 0 }, { opacity: 1 }];
				// Closing runs the same keyframes backwards but keeps the fast-start curve, so it answers the click at once
				if (!opening) { frameKeys.reverse(); fade.reverse(); }
				anims = [
					frame.animate(frameKeys, { duration: still ? 150 : t, easing: ease, fill: 'both' }),
					shade.animate(fade, { duration: t, easing: 'ease-out', fill: 'both' }),
					caption.animate(fade, { duration: t * 0.6, delay: opening ? t * 0.4 : 0, easing: 'ease-out', fill: 'both' }),
					nav.animate(fade, { duration: t * 0.6, delay: opening ? t * 0.4 : 0, easing: 'ease-out', fill: 'both' }),
					closeBtn.animate(fade, { duration: t * 0.6, delay: opening ? t * 0.4 : 0, easing: 'ease-out', fill: 'both' })
				];
				return anims[0].finished;
			}

			function open(link) {
				if (current !== -1) return;
				// Step in the order the eye reads the grid: wide and paired plates are packed out of source order
				links.sort(function (a, b) { var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect(); return (ra.top - rb.top) || (ra.left - rb.left); });
				var i = current = links.indexOf(link);
				document.body.style.cursor = 'progress';
				load(i).then(function (pic) {
					document.body.style.cursor = '';
					document.documentElement.classList.add('lb-open');
					dlg.showModal();
					fill(i, pic);
					setHidden(i, true);
					play(true);
				});
			}

			function close() {
				if (current === -1 || closing) return;
				closing = true;
				var running = anims.length && anims[0].playState === 'running';
				if (running) anims.forEach(function (a) { a.reverse(); });   // caught mid-open: just run it backwards
				else {
					var t = thumb(current).getBoundingClientRect();
					if (t.bottom < 0 || t.top > innerHeight) links[current].scrollIntoView({ block: 'center' });
					play(false);
				}
				anims[0].finished.then(function () {
					anims.forEach(function (a) { a.cancel(); });
					anims = [];
					dlg.close();
					document.documentElement.classList.remove('lb-open');
					setHidden(current, false);
					links[current].focus({ preventScroll: true });
					current = -1;
					closing = false;
				});
			}

			function step(d) {
				if (current === -1 || closing) return;
				var next = (current + d + links.length) % links.length;
				load(next).then(function (pic) {
					if (current === -1 || closing) return;
					setHidden(current, false);
					current = next;
					setHidden(current, true);
					links[current].scrollIntoView({ block: 'center' });   // the page follows along behind, so closing lands on it
					fill(current, pic);
					frame.animate([{ opacity: 0.4 }, { opacity: 1 }], { duration: 180, easing: 'ease-out' });
				});
			}

			links.forEach(function (a) {
				a.addEventListener('click', function (e) {
					if (e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;   // let "open in new tab" work
					e.preventDefault();
					open(a);
				});
			});

			var swipeX = null, swipeY = 0, swiped = false;
			dlg.addEventListener('pointerdown', function (e) { swipeX = e.clientX; swipeY = e.clientY; swiped = false; });
			dlg.addEventListener('pointerup', function (e) {
				if (swipeX === null) return;
				var dx = e.clientX - swipeX, dy = e.clientY - swipeY;
				swipeX = null;
				if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { swiped = true; step(dx < 0 ? 1 : -1); }
			});
			dlg.addEventListener('click', function (e) {
				if (swiped) { swiped = false; return; }
				if (e.target.closest('.lb-prev')) step(-1);
				else if (e.target.closest('.lb-next')) step(1);
				else close();
			});
			dlg.addEventListener('cancel', function (e) { e.preventDefault(); close(); });
			dlg.addEventListener('keydown', function (e) {
				if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
				else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
			});
			addEventListener('resize', function () {
				if (current !== -1 && !closing) fill(current, img);
			});
		})();
		</script>
	</body>
</html>
